name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m dripleg.tools.check_migrations
      - run: python -m dripleg.tools.check_workflow
      - run: python -m dripleg.tools.query_plan
      - run: python -m dripleg.tools.check_exports
      - run: python -m dripleg.tools.release_check
      - run: python -m dripleg.tools.schema_dump --check
      - run: python -m dripleg.tools.build_docs --check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov --cov-report=json --cov-report=term-missing
      - run: python -m dripleg.tools.coverage_gate --floor 90 --file-floor 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.json

  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: dripleg --version
      - run: python -m dripleg.tools.smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import dripleg; print(dripleg.__version__)"
      - run: python -m dripleg.tools.smoke --quiet
      - run: dripleg --book /tmp/smoke.sqlite3 init
      - run: dripleg --book /tmp/smoke.sqlite3 book check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  installed-walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: stand a plant up and walk it
        run: |
          set -euo pipefail
          book=/tmp/walk.sqlite3
          dripleg --book "$book" init
          dripleg --book "$book" site add WRX1 "Wrexham paper mill" --operator "Bryn Paper"
          dripleg --book "$book" area add B12 "Number 2 machine" --cost-centre PM2
          dripleg --book "$book" header add B12 MP "Machine room main" \
            --psig 125 --discharge-psig 15
          dripleg --book "$book" model add Halden TD52 \
            --principle thermodynamic_disc --orifice 0.093 --pmo 600 --price 184.00
          dripleg --book "$book" profile add CONT Continuous
          dripleg --book "$book" trap add B12-MP-1 --model Halden/TD52 \
            --installed 2021-06-14
          dripleg --book "$book" prices set --fuel 6.25 --from 2025-01-01
          dripleg --book "$book" survey open S2025-1 Spring \
            --contractor "Vane Energy" --started 2025-04-07
          printf '%s\n%s\n' \
            'tag,date,by,condition,db,seconds,cycles,up_f,down_f,amb_f,glass,psig,note' \
            'B12-MP-1,2025-04-08,R Ellis,failed open,70,30,0,345,258,74,,,' \
            > /tmp/walk.csv
          dripleg --book "$book" survey import S2025-1 /tmp/walk.csv
          dripleg --book "$book" survey report S2025-1
          dripleg --book "$book" loss report S2025-1 --save
          dripleg --book "$book" work list S2025-1
          dripleg --book "$book" work raise S2025-1 --on 2025-04-14
          dripleg --book "$book" programme due --on 2026-01-01
          dripleg --book "$book" book audit
          dripleg --book "$book" doctor --on 2026-01-01 || true
